<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy City Index - Rank Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1em;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 5px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .value-display {
            min-width: 50px;
            text-align: center;
            font-weight: 700;
            color: #667eea;
            font-size: 1.1em;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .result-item {
            margin: 10px 0;
            font-size: 1.1em;
            color: #333;
        }

        .result-item strong {
            color: #667eea;
        }

        .total-score {
            font-size: 1.3em;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏙️ Happy City Index</h1>
        <p class="subtitle">Enter indicator scores to find matching city rank</p>

        <form id="scoreForm">
            <div class="input-group">
                <label for="citizens">Citizens</label>
                <div class="slider-container">
                    <input type="range" id="citizens" min="0" max="300" value="150">
                    <span class="value-display" id="citizens-value">150</span>
                </div>
            </div>

            <div class="input-group">
                <label for="governance">Governance</label>
                <div class="slider-container">
                    <input type="range" id="governance" min="0" max="300" value="150">
                    <span class="value-display" id="governance-value">150</span>
                </div>
            </div>

            <div class="input-group">
                <label for="environment">Environment</label>
                <div class="slider-container">
                    <input type="range" id="environment" min="0" max="300" value="150">
                    <span class="value-display" id="environment-value">150</span>
                </div>
            </div>

            <div class="input-group">
                <label for="economy">Economy</label>
                <div class="slider-container">
                    <input type="range" id="economy" min="0" max="300" value="150">
                    <span class="value-display" id="economy-value">150</span>
                </div>
            </div>

            <div class="input-group">
                <label for="health">Health</label>
                <div class="slider-container">
                    <input type="range" id="health" min="0" max="300" value="150">
                    <span class="value-display" id="health-value">150</span>
                </div>
            </div>

            <div class="input-group">
                <label for="mobility">Mobility</label>
                <div class="slider-container">
                    <input type="range" id="mobility" min="0" max="300" value="150">
                    <span class="value-display" id="mobility-value">150</span>
                </div>
            </div>

            <button type="submit">Calculate Rank</button>
        </form>

        <div class="result" id="result">
            <h2>Results</h2>
            <div class="result-item"><strong>Closest Match:</strong> <span id="city-name"></span>, <span id="country-name"></span></div>
            <div class="result-item"><strong>Rank:</strong> <span id="rank"></span></div>
            <div class="result-item total-score"><strong>Your Total Score:</strong> <span id="total-score"></span></div>
            <div class="result-item"><strong>City's Total Score:</strong> <span id="city-total-score"></span></div>
        </div>
    </div>

        // Update slider values
        const sliders = ['citizens', 'governance', 'environment', 'economy', 'health', 'mobility'];
        sliders.forEach(slider => {
            const input = document.getElementById(slider);
            const display = document.getElementById(`${slider}-value`);
            
            input.addEventListener('input', (e) => {
                display.textContent = e.target.value;
            });
        });

        // Form submission
        document.getElementById('scoreForm').addEventListener('submit', (e) => {
            e.preventDefault();

            // Get input values
            const inputScores = {
                citizens: parseInt(document.getElementById('citizens').value),
                governance: parseInt(document.getElementById('governance').value),
                environment: parseInt(document.getElementById('environment').value),
                economy: parseInt(document.getElementById('economy').value),
                health: parseInt(document.getElementById('health').value),
                mobility: parseInt(document.getElementById('mobility').value)
            };

            // Calculate total
            const totalScore = Object.values(inputScores).reduce((a, b) => a + b, 0);

            // Find closest city by calculating Euclidean distance
            let closestCity = null;
            let minDistance = Infinity;

            cities.forEach(city => {
                const distance = Math.sqrt(
                    Math.pow(city.citizens - inputScores.citizens, 2) +
                    Math.pow(city.governance - inputScores.governance, 2) +
                    Math.pow(city.environment - inputScores.environment, 2) +
                    Math.pow(city.economy - inputScores.economy, 2) +
                    Math.pow(city.health - inputScores.health, 2) +
                    Math.pow(city.mobility - inputScores.mobility, 2)
                );

                if (distance < minDistance) {
                    minDistance = distance;
                    closestCity = city;
                }
            });

            // Display result
            document.getElementById('city-name').textContent = closestCity.city;
            document.getElementById('country-name').textContent = closestCity.country;
            document.getElementById('rank').textContent = closestCity.rank;
            document.getElementById('total-score').textContent = totalScore;
            document.getElementById('city-total-score').textContent = closestCity.total_points;
            document.getElementById('result').classList.add('show');
        });
    </script>
